<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-mindmap" viewBox="0 0 266 296" width="266" height="296" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="mindmap"><g transform="translate(8,8)"><g class="pele-branch pele-section-0"><g class="pele-edges" fill="none" stroke="var(--pele-series-1,#4c78a8)" stroke-width="1.5"><path class="pele-edge" d="M20,96V156Q20,164 28,164H28"/></g><g class="pele-node pele-shape-rect" data-id="id2" transform="translate(138.68,164)"><rect x="-110.68" y="-48" width="221.36" height="96" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.22" stroke="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">She lives in </tspan><tspan font-weight="var(--_w)">the</tspan><tspan> crater of</tspan><tspan x="0" y="5.6">Kīlauea... a </tspan><tspan font-style="italic">very old story</tspan><tspan x="0" y="29.6">that is still told today</tspan></text></g></g><g class="pele-branch pele-section-1"><g class="pele-edges" fill="none" stroke="var(--pele-series-2,#f58518)" stroke-width="1.5"><path class="pele-edge" d="M20,156V248Q20,256 28,256H28"/></g><g class="pele-node pele-shape-rect" data-id="id3" transform="translate(120.7,256)"><rect x="-92.7" y="-24" width="185.41" height="48" fill="var(--pele-series-2,#f58518)" fill-opacity="0.22" stroke="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text class