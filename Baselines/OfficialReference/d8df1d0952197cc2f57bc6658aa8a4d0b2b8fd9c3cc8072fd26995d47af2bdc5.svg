<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 320 1024" width="320" height="1024" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="25.6">England's History Timeline</tspan></text><path class="pele-axis" d="M132,48V1009" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M132,1016L128.64,1008L135.36,1008Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="48" width="304" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="73.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="100" width="104" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="125.6" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M112,120H132M146,150H160M132,120H146V150" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="120" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="100" width="152" height="100" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="123.4">Britain's oldest</tspan><tspan x="236" y="144.4">known house was</tspan><tspan x="236" y="165.4">built in Orkney,</tspan><tspan x="236" y="186.4">Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="8" y="220" width="104" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="245.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M112,240H132M146,291H160M132,240H146V291" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="240" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="220" width="152" height="142" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="243.4">Sea levels rise and</tspan><tspan x="236" y="264.4">Britain becomes an</tspan><tspan x="236" y="285.4">island.</tspan><tspan x="236" y="306.4">The people who live</tspan><tspan x="236" y="327.4">here are</tspan><tspan x="236" y="348.4">hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="8" y="382" width="304" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="407.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="8" y="434" width="104" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="459.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M112,454H132M146,494.5H160M146,613H160M132,454H146V613" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="454" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="434" width="152" height="121" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="457.4">People arrive from</tspan><tspan x="236" y="478.4">Europe and settle in</tspan><tspan x="236" y="499.4">Britain.</tspan><tspan x="236" y="520.4">They bring farming</tspan><tspan x="236" y="541.4">and metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="160" y="563" width="152" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="586.4">New styles of</tspan><tspan x="236" y="607.4">pottery and ways of</tspan><tspan x="236" y="628.4">burying the dead</tspan><tspan x="236" y="649.4">appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="8" y="683" width="104" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="708.6" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M112,703H132M146,764.5H160M146,925H160M132,703H146V925" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="703" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="683" width="152" height="163" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="706.4">The last major</tspan><tspan x="236" y="727.4">building works are</tspan><tspan x="236" y="748.4">completed at</tspan><tspan x="236" y="769.4">Stonehenge.</tspan><tspan x="236" y="790.4">People now bury</tspan><tspan x="236" y="811.4">their dead in stone</tspan><tspan x="236" y="832.4">circles.</tspan></text></g><g class="pele-node pele-event"><rect x="160" y="854" width="152" height="142" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="877.4">The first metal</tspan><tspan x="236" y="898.4">objects are made in</tspan><tspan x="236" y="919.4">Britain.Some other</tspan><tspan x="236" y="940.4">nice things happen.</tspan><tspan x="236" y="961.4">it is a good time to</tspan><tspan x="236" y="982.4">be alive.</tspan></text></g></g></g></svg>