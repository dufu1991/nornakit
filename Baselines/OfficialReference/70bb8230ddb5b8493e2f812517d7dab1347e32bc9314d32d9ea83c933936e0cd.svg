>functionality to customers via</tspan><tspan x="0" y="57.55">their web browser.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="ma" transform="translate(384,85)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Provides a limited subset to the</tspan><tspan x="0" y="27.55">internet banking functionality to</tspan><tspan x="0" y="47.55">customers via their mobile</tspan><tspan x="0" y="67.55">device.</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-container_db" data-id="db" transform="translate(108,355)"><path d="M-108,-85A108,12 0 0 1 108,-85V85A108,12 0 0 1 -108,85Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-108,-85A108,12 0 0 0 108,-85" fill="none" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-53.8" text-anchor="middle">«container db»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-31.4">Database</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-10.45" text-anchor="middle">[Relational Database Schema]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="13.55">Stores user registration</tspan><tspan x="0" y="33.55">information, hashed</tspan><tspan x="0" y="53.55">authentication credentials,</tspan><tspan x="0" y="73.55">access logs, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="mbs" transform="translate(384,355)"><rect x="-108" y="-97" width="216" height="194" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-51.8" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.4">Mainframe Banking</tspan><tspan x="0" y="-5.4">System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="19.55">Stores all of the core banking</tspan><tspan x="0" y="39.55">information about customers,</tspan><tspan x="0" y="59.55">accounts, transactions, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="sign" transform="translate(120,657)"><rect x="-108" y="-77" width="216" height="154" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="3.55" text-anchor="middle">[MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="27.55">Allows users to sign in to the</tspan><tspan x="0" y="47.55">internet banking system</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="accounts" transform="translate(396,657)"><rect x="-108" y="-77" width="216" height="154" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-51.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space