<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 480 709" width="480" height="709" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="25.6">Hawaiʻi's History Timeline</tspan></text><path class="pele-axis" d="M192,48V694" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M192,701L188.64,693L195.36,693Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Voyagers"><rect x="8" y="48" width="464" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="73.6">Voyagers</tspan></text><g class="pele-node pele-period" data-id="1000 AD"><rect x="8" y="100" width="164" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="125.6" text-anchor="middle">1000 AD</text><path class="pele-edge" d="M172,120H192M206,129H220M192,120H206V129" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="120" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="100" width="252" height="58" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="123.4">Polynesian voyagers reach Hawaiʻi</tspan><tspan x="346" y="144.4">in sailing canoes</tspan></text></g></g><g class="pele-node pele-period" data-id="1778"><rect x="8" y="178" width="164" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="203.6" text-anchor="middle">1778</text><path class="pele-edge" d="M172,198H192M206,217.5H220M192,198H206V217.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="198" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="178" width="252" height="79" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="201.4">Captain Cook lands on Kauaʻi.</tspan><tspan x="346" y="222.4">Islanders and Europeans meet for</tspan><tspan x="346" y="243.4">the first time.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Kingdom"><rect x="8" y="277" width="464" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="302.6">Kingdom</tspan></text><g class="pele-node pele-period" data-id="1810"><rect x="8" y="329" width="164" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="354.6" text-anchor="middle">1810</text><path class="pele-edge" d="M172,349H192M206,379H220M206,466H220M192,349H206V466" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="349" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="329" width="252" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="352.4">King Kamehameha unites the</tspan><tspan x="346" y="373.4">islands.</tspan><tspan x="346" y="394.4">They are ruled as one kingdom for</tspan><tspan x="346" y="415.4">the first time.</tspan></text></g><g class="pele-node pele-event"><rect x="220" y="437" width="252" height="58" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="460.4">Ships from around the world stop to</tspan><tspan x="346" y="481.4">trade.</tspan></text></g></g><g class="pele-node pele-period" data-id="1882"><rect x="8" y="515" width="164" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="540.6" text-anchor="middle">1882</text><path class="pele-edge" d="M172,535H192M206,565H220M206,652H220M192,535H206V652" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="535" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="515" width="252" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="538.4">ʻIolani Palace is completed in</tspan><tspan x="346" y="559.4">Honolulu.</tspan><tspan x="346" y="580.4">It soon has electric lights and</tspan><tspan x="346" y="601.4">telephones.</tspan></text></g><g class="pele-node pele-event"><rect x="220" y="623" width="252" height="58" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="646.4">Most people in the kingdom can</tspan><tspan x="346" y="667.4">read and write.</tspan></text></g></g></g></svg>