<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 320 898" width="320" height="898" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="25.6">Hawaiʻi's History Timeline</tspan></text><path class="pele-axis" d="M132,48V883" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M132,890L128.64,882L135.36,882Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Voyagers"><rect x="8" y="48" width="304" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="73.6">Voyagers</tspan></text><g class="pele-node pele-period" data-id="1000 AD"><rect x="8" y="100" width="104" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="125.6" text-anchor="middle">1000 AD</text><path class="pele-edge" d="M112,120H132M146,150H160M132,120H146V150" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="120" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="100" width="152" height="100" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="123.4">Polynesian</tspan><tspan x="236" y="144.4">voyagers reach</tspan><tspan x="236" y="165.4">Hawaiʻi in sailing</tspan><tspan x="236" y="186.4">canoes</tspan></text></g></g><g class="pele-node pele-period" data-id="1778"><rect x="8" y="220" width="104" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="245.6" text-anchor="middle">1778</text><path class="pele-edge" d="M112,240H132M146,280.5H160M132,240H146V280.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="240" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="220" width="152" height="121" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="243.4">Captain Cook lands</tspan><tspan x="236" y="264.4">on Kauaʻi.</tspan><tspan x="236" y="285.4">Islanders and</tspan><tspan x="236" y="306.4">Europeans meet for</tspan><tspan x="236" y="327.4">the first time.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Kingdom"><rect x="8" y="361" width="304" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="386.6">Kingdom</tspan></text><g class="pele-node pele-period" data-id="1810"><rect x="8" y="413" width="104" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="438.6" text-anchor="middle">1810</text><path class="pele-edge" d="M112,433H132M146,473.5H160M146,581.5H160M132,433H146V581.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="433" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="413" width="152" height="121" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="436.4">King Kamehameha</tspan><tspan x="236" y="457.4">unites the islands.</tspan><tspan x="236" y="478.4">They are ruled as</tspan><tspan x="236" y="499.4">one kingdom for the</tspan><tspan x="236" y="520.4">first time.</tspan></text></g><g class="pele-node pele-event"><rect x="160" y="542" width="152" height="79" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="565.4">Ships from around</tspan><tspan x="236" y="586.4">the world stop to</tspan><tspan x="236" y="607.4">trade.</tspan></text></g></g><g class="pele-node pele-period" data-id="1882"><rect x="8" y="641" width="104" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="60" y="666.6" text-anchor="middle">1882</text><path class="pele-edge" d="M112,661H132M146,712H160M146,830.5H160M132,661H146V830.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="132" cy="661" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="160" y="641" width="152" height="142" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="664.4">ʻIolani Palace is</tspan><tspan x="236" y="685.4">completed in</tspan><tspan x="236" y="706.4">Honolulu.</tspan><tspan x="236" y="727.4">It soon has electric</tspan><tspan x="236" y="748.4">lights and</tspan><tspan x="236" y="769.4">telephones.</tspan></text></g><g class="pele-node pele-event"><rect x="160" y="791" width="152" height="79" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="236" y="814.4">Most people in the</tspan><tspan x="236" y="835.4">kingdom can read</tspan><tspan x="236" y="856.4">and write.</tspan></text></g></g></g></svg>