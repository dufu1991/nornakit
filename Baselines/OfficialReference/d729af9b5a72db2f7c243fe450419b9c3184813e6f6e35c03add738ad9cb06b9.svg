<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 480 751" width="480" height="751" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="25.6">England's History Timeline</tspan></text><path class="pele-axis" d="M192,48V736" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M192,743L188.64,735L195.36,735Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="48" width="464" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="73.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="100" width="164" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="125.6" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M172,120H192M206,129H220M192,120H206V129" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="120" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="100" width="252" height="58" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="123.4">Britain's oldest known house was</tspan><tspan x="346" y="144.4">built in Orkney, Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="8" y="178" width="164" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="203.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M172,198H192M206,228H220M192,198H206V228" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="198" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="178" width="252" height="100" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="201.4">Sea levels rise and Britain becomes</tspan><tspan x="346" y="222.4">an island.</tspan><tspan x="346" y="243.4">The people who live here are</tspan><tspan x="346" y="264.4">hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="8" y="298" width="464" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="240" y="323.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="8" y="350" width="164" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="375.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M172,370H192M206,400H220M206,487H220M192,370H206V487" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="370" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="350" width="252" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="373.4">People arrive from Europe and settle</tspan><tspan x="346" y="394.4">in Britain.</tspan><tspan x="346" y="415.4">They bring farming and</tspan><tspan x="346" y="436.4">metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="220" y="458" width="252" height="58" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="481.4">New styles of pottery and ways of</tspan><tspan x="346" y="502.4">burying the dead appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="8" y="536" width="164" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="90" y="561.6" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M172,556H192M206,586H220M206,683.5H220M192,556H206V683.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="192" cy="556" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="220" y="536" width="252" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="559.4">The last major building works are</tspan><tspan x="346" y="580.4">completed at Stonehenge.</tspan><tspan x="346" y="601.4">People now bury their dead in stone</tspan><tspan x="346" y="622.4">circles.</tspan></text></g><g class="pele-node pele-event"><rect x="220" y="644" width="252" height="79" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="346" y="667.4">The first metal objects are made in</tspan><tspan x="346" y="688.4">Britain.Some other nice things</tspan><tspan x="346" y="709.4">happen. it is a good time to be alive.</tspan></text></g></g></g></svg>