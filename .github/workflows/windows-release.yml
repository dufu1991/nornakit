name: Release Windows Studio
on:
  workflow_dispatch:
    inputs:
      version:
        description: Must match Windows/StudioVersion.props
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: x64
          - runner: windows-11-arm
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json
      - name: Check independent Studio version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [xml]$props = Get-Content StudioVersion.props -Raw
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_VERSION -ne $props.Project.PropertyGroup.Version) { throw 'The release version must match StudioVersion.props.' }
      - run: dotnet restore NornaKit.slnx -p:Platform=${{ matrix.platform }} --locked-mode
      - run: dotnet run --project tests/NornaKit.Core.Tests -c Release --no-restore
      - run: dotnet publish tests/NornaKit.Windows.SmokeTests -c Release --no-restore -p:Platform=${{ matrix.platform }} -o artifacts/smoke
      - run: ./artifacts/smoke/NornaKit.Windows.SmokeTests.exe artifacts/native-smoke
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 pypdf==6.1.1
          python scripts/verify-native-smoke.py artifacts/native-smoke
      - run: ./scripts/install-inno.ps1
      - run: ./scripts/package-studio.ps1 -Platform ${{ matrix.platform }}
      - run: ./scripts/verify-install.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ matrix.platform }}
          path: Windows/artifacts/packages
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-release-*
          merge-multiple: true
          path: packages
      - name: Publish independent Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Native Windows 11 x64 and ARM64 builds.\n\nVersion: %s\nSource commit: %s\n\nThe installers install for the current user. Portable ZIP files include both .NET and Windows App SDK runtimes. SHA-256 checksums accompany each download.\n' "$RELEASE_VERSION" "$SOURCE_COMMIT" > release-notes.md
          gh release create "studio-windows-v$RELEASE_VERSION" packages/* --target "$SOURCE_COMMIT" --title "Norna Studio for Windows $RELEASE_VERSION" --notes-file release-notes.md --latest=false
