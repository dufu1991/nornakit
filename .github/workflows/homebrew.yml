name: Publish Studio to Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Published Kit or standalone Studio tag containing companion assets
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0 or studio-v0.1.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: studio-homebrew
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dufu1991/nornakit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check tap credentials
        id: credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo 'Immediate cross-repository synchronization is not configured; the tap-owned workflow will synchronize the published release.'
            echo 'The tap-owned Sync Norna Studio workflow synchronizes published releases hourly and can be run manually. HOMEBREW_TAP_TOKEN optionally enables immediate synchronization.' >> "$GITHUB_STEP_SUMMARY"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: Download and verify the published Studio package
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'(?:studio-)?v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('Expected a stable Kit or Studio release tag')
          release = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/dufu1991/nornakit/releases/tags/{tag}'
          ], text=True))
          if release['draft'] or release['prerelease'] or release['tag_name'] != tag:
              raise SystemExit('Only a published stable release can be sent to Homebrew')
          PY
          gh release download "$RELEASE_TAG" --repo dufu1991/nornakit \
            --pattern Norna-Studio-macOS-arm64.dmg \
            --pattern release.json --pattern SHA256SUMS.txt --dir build/release
          python3 Scripts/Release/homebrew.py render --tag "$RELEASE_TAG"
          ruby -c build/release/norna-studio.rb
      - name: Update the companion app Cask in the personal tap
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 Scripts/Release/homebrew.py sync
